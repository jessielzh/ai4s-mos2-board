<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoS₂ Growth Loop</title>
<style>
:root {
  color-scheme: light;
  --bg: #fcfcfb; --card: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --muted: #7a7974;
  --line: #e6e5e0; --grid: #efeee9; --series: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1a1a19; --card: #222221; --ink: #f0efec; --ink2: #c3c2b7; --muted: #9a998f;
    --line: #3a3a37; --grid: #2c2c2a; --series: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1a19; --card: #222221; --ink: #f0efec; --ink2: #c3c2b7; --muted: #9a998f;
  --line: #3a3a37; --grid: #2c2c2a; --series: #3987e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 28px 16px 48px; }
.eyebrow { margin: 0; font-size: 12px; color: var(--muted); letter-spacing: .02em; }
h1 { font-size: 26px; margin: 2px 0 2px; }
h2 { font-size: 15px; margin: 0; font-weight: 600; }
.muted { margin: 2px 0 0; font-size: 13px; color: var(--muted); font-weight: 400; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 14px 0; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.vals { display: flex; gap: 20px; font-variant-numeric: tabular-nums; }
.vals b { font-size: 20px; }
.vals span { font-size: 12px; color: var(--muted); margin-left: 4px; }
svg { width: 100%; height: auto; display: block; margin-top: 8px; }
.grid { stroke: var(--grid); stroke-width: 1; }
.tick { fill: var(--muted); font-size: 11px; }
.series { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; }
.dot { fill: var(--series); stroke: var(--card); stroke-width: 2; }
.hit { fill: transparent; cursor: pointer; }
.dlabel { fill: var(--ink); font-size: 12px; font-weight: 600; }
details { margin-top: 4px; font-size: 13px; }
summary { cursor: pointer; color: var(--ink2); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 8px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
td.note { white-space: normal; color: var(--ink2); }
dl { margin: 8px 0 0; font-size: 13px; color: var(--ink2); }
dt { font-weight: 600; color: var(--ink); margin-top: 6px; }
dd { margin: 0; }
#tip { position: fixed; pointer-events: none; background: var(--card); color: var(--ink); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; }
#tip b { font-size: 14px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">AI4S · MoS₂ CVD growth · two-zone temperature program</p>
  <h1>MoS₂ Growth Loop</h1>
  <p class="muted" id="sub">Loading…</p>
  <div id="panels"></div>
  <section>
    <details>
      <summary>Metric definitions</summary>
      <dl id="defs"></dl>
    </details>
    <details>
      <summary>All runs</summary>
      <div class="scroll"><table><thead id="thead"></thead><tbody id="rows"></tbody></table></div>
    </details>
  </section>
  <p class="muted">One row per growth run. Process and reasoning are discussed in the weekly meeting.</p>
</main>
<div id="tip"></div>

<script>
// The metrics on this board. Changed only after the weekly meeting agrees; bump VERSION
// and recompute earlier runs under the new definitions in data.csv.
const VERSION = "v1";
const METRICS = [
  { key: "coverage", name: "Coverage", pct: true, better: "higher", target: 1,
    def: "Fraction of the imaged substrate covered by MoS₂. Edge set at half the flake contrast, so it does not move with blur or pixel size." },
  { key: "size_um", name: "Region size L₅₀,w", unit: "µm", better: "higher", target: 1000,
    def: "Area-weighted median size: half of the covered area lies in flakes or connected regions at least this large (edge length of the equal-area triangle). Robust to field size, unlike the maximum. As flakes merge into a film it approaches the film size; for a film larger than the field it needs a 5× overview." },
  { key: "thick_frac", name: "Thick / multilayer fraction", pct: true, better: "lower",
    def: "Share of the covered area clearly darker than the flake body (contrast above 1.5 × its 25th percentile): thick centres and multilayer patches." },
  { key: "tile_cv", name: "Non-uniformity (tile-CV)", better: "lower",
    def: "Coefficient of variation of coverage over 25 µm × 25 µm tiles. 0 = evenly covered." },
];

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  const head = lines.shift().split(",").map(s => s.trim());
  return lines.map(line => {
    const cells = line.split(",");   // the last column (note) may contain commas
    const row = {};
    head.forEach((h, i) => row[h] = (i === head.length - 1 ? cells.slice(i).join(",") : cells[i] || "").trim().replace(/^"|"$/g, ""));
    return row;
  });
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fmt(v, m) {
  if (v == null || isNaN(v)) return "—";
  if (m.pct) return (v * 100).toFixed(v > 0 && v < 0.1 ? 1 : 0) + "%";
  return v.toLocaleString("en-US", { maximumFractionDigits: v < 10 ? 2 : (v < 100 ? 1 : 0) });
}
const num = s => (s === undefined || s === "") ? null : Number(s);

function render(all) {
  const runs = all.filter(r => r.date).sort((a, b) => a.date.localeCompare(b.date) || a.run.localeCompare(b.run));
  const cur = runs.filter(r => r.metric_version === VERSION);
  document.getElementById("sub").textContent = runs.length
    ? `${runs.length} runs · last run ${runs[runs.length - 1].date} · metrics ${VERSION}` : "No runs yet.";

  document.getElementById("panels").innerHTML = METRICS.map(m => {
    const pts = cur.map((r, x) => ({ x, r, v: num(r[m.key]) })).filter(p => p.v != null && !isNaN(p.v));
    if (!pts.length) return "";
    const last = pts[pts.length - 1].v;
    const best = m.better === "higher" ? Math.max(...pts.map(p => p.v)) : Math.min(...pts.map(p => p.v));
    return `<section>
      <div class="head"><h2>${esc(m.name)}${m.unit ? ` (${m.unit})` : ""} <span class="muted">· ${m.better} is better</span></h2>
      <div class="vals"><div><b>${fmt(last, m)}</b><span>latest</span></div><div><b>${fmt(best, m)}</b><span>best</span></div>${m.target != null ? `<div><b>${fmt(m.target, m)}</b><span>target</span></div>` : ""}</div></div>
      ${chart(pts, cur, m)}</section>`;
  }).join("");

  document.getElementById("defs").innerHTML = METRICS.map(m => `<dt>${esc(m.name)}</dt><dd>${esc(m.def)}</dd>`).join("");
  document.getElementById("thead").innerHTML = `<tr><th>Date</th><th>Run</th>${METRICS.map(m => `<th>${esc(m.name)}</th>`).join("")}<th>Metrics</th><th>Note</th></tr>`;
  document.getElementById("rows").innerHTML = runs.slice().reverse().map(r =>
    `<tr><td>${esc(r.date)}</td><td>${esc(r.run)}</td>${METRICS.map(m => `<td>${fmt(num(r[m.key]), m)}</td>`).join("")}<td>${esc(r.metric_version)}</td><td class="note">${esc(r.note || "")}</td></tr>`).join("");
  bindTips();
}

function chart(pts, runs, m) {
  const W = 680, H = 180, L = 52, R = 20, T = 16, B = 40;
  const n = Math.max(runs.length - 1, 1);
  const sx = x => L + x / n * (W - L - R);
  const top = Math.max(...pts.map(p => p.v)) * 1.1 || 1;
  let step = 1;
  outer: for (let e = -4; e < 7; e++) for (const k of [1, 2, 2.5, 5]) { if (k * 10 ** e * 4 >= top) { step = k * 10 ** e; break outer; } }
  const sy = v => H - B - v / (step * 4) * (H - T - B);

  let g = "";
  for (let i = 0; i <= 4; i++) {
    const y = sy(step * i);
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="tick" x="${L - 6}" y="${y + 4}" text-anchor="end">${fmt(step * i, m)}</text>`;
  }
  // x axis = runs in growth-date order; two runs on one day stay separate points
  const every = Math.ceil(runs.length / 8);
  runs.forEach((r, x) => {
    if (x % every === 0 || x === runs.length - 1)
      g += `<text class="tick" x="${sx(x)}" y="${H - 22}" text-anchor="middle">${esc(r.run)}</text><text class="tick" x="${sx(x)}" y="${H - 8}" text-anchor="middle">${esc(r.date.slice(5))}</text>`;
  });
  const line = `<polyline class="series" points="${pts.map(p => `${sx(p.x)},${sy(p.v)}`).join(" ")}"/>`;
  const dots = pts.map(p => {
    const tip = esc(JSON.stringify({ t: `${p.r.run} · ${p.r.date}`, v: `${m.name}: ${fmt(p.v, m)}${m.unit ? " " + m.unit : ""}`, n: p.r.note || "" }));
    return `<circle class="dot" cx="${sx(p.x)}" cy="${sy(p.v)}" r="4.5"/><circle class="hit" cx="${sx(p.x)}" cy="${sy(p.v)}" r="14" data-tip="${tip}"/>`;
  }).join("");
  const last = pts[pts.length - 1];
  const label = `<text class="dlabel" x="${sx(last.x)}" y="${sy(last.v) - 10}" text-anchor="middle">${fmt(last.v, m)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.name)} by run">${g}${line}${dots}${label}</svg>`;
}

function bindTips() {
  const tip = document.getElementById("tip");
  document.querySelectorAll(".hit").forEach(el => {
    el.addEventListener("pointerenter", () => {
      const d = JSON.parse(el.dataset.tip);
      tip.innerHTML = `${esc(d.t)}<br><b>${esc(d.v)}</b>${d.n ? `<br><span style="color:var(--muted)">${esc(d.n)}</span>` : ""}`;
      tip.style.display = "block";
    });
    el.addEventListener("pointermove", e => {
      tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px";
      tip.style.top = (e.clientY + 12) + "px";
    });
    el.addEventListener("pointerleave", () => tip.style.display = "none");
  });
}

fetch("data.csv", { cache: "no-store" })
  .then(r => r.ok ? r.text() : Promise.reject(r.status))
  .then(t => render(parseCSV(t)))
  .catch(() => { document.getElementById("sub").textContent = "Could not load data.csv."; });
</script>
</body>
</html>
